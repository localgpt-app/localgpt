# Cloudflare Worker for localgpt.md, the previs page: static assets only,
# no Worker script, nothing to build. Deploy with ./deploy.sh from this
# directory. Routing is in the dashboard: localgpt.md is the canonical
# host, md.localgpt.app 301s to it.
name = "localgpt-md"
compatibility_date = "2026-09-21"

[assets]
directory = "."
