base_url = "https://localgpt.app"
title = "LocalGPT"
description = "Open a document, song or screenplay as an editable 3D world. LocalGPT is a native desktop app with local world tools and your own coding agents beside it."
compile_sass = false
build_search_index = true
generate_feeds = false

[markdown]
smart_punctuation = true
bottom_footnotes = true
github_alerts = true
insert_anchor_links = "right"

[markdown.highlighting]
theme = "dracula"

