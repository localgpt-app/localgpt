# Cloudflare Worker for localgpt.app: static assets only, generated by Zola.
# Deploy with ./deploy.sh from this directory.
name = "localgpt-app"
compatibility_date = "2026-09-22"

# The custom domain: localgpt.app is a zone on this account, and a deploy
# attaches the Worker to it (DNS and the certificate are Cloudflare's).
routes = [
  { pattern = "localgpt.app", custom_domain = true }
]

[assets]
directory = "./public"
# Zola writes pretty URLs (path/index.html) and a root 404.html.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true
