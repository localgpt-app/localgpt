[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/cli-tools",
    "crates/server",
    "crates/sandbox",
    "crates/mobile-ffi",
    "crates/gen",
    "crates/app",
    "crates/md",
    "crates/previs",
    "crates/previs-web",
    "crates/verse",
    "crates/world-types",
    "crates/world-export",
    "crates/world-bevy",
    "crates/world-audio",
    "crates/world-sync",
    "crates/world-editor",
    "crates/world-agent",
    "crates/relay",
    "crates/bridge",
    "bridges/cli",
]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/localgpt-app/localgpt"
homepage = "https://localgpt.app"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
rate-limit.new-packages = 10

[workspace.dependencies]
# 0.3.5: `ext-cinematography` 0.3 — a camera aims and focuses on an entity
# (`aim_entity`, `focus_entity`, references the merge rewrites like `parent`),
# origins composed through parents (`world_origin`, `view_in`), and committed
# ops that carry ids for the deeper references.
# 0.3.6: validation warns about a behavior whose target is gone — the
# dangling-target diagnostic the inspector and the live canvas show.
openworldformat = "0.3.6"

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# HTTP client for LLM APIs
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "form", "native-tls-vendored"] }

# Database
rusqlite = { version = "0.40", features = ["bundled", "functions", "vtab", "load_extension"] }
sqlite-vec = "0.1.7-alpha.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Safe-Rust YAML; the deprecated serde_yaml sat on the unmaintained
# unsafe-libyaml (RUSTSEC-2024-0449). Only SKILL.md frontmatter is read,
# so the serializer half stays off.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
toml = "1.0"
# Final Draft's .fdx is XML: a small pure-Rust DOM reads it in the previs
# crate — on WASM too. No DTD, so no entity expansion beyond the five
# predefined ones.
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
# A screenplay PDF's text layer, with positions (`crates/previs/src/pdf.rs`):
# pure Rust over lopdf, built for wasm32 too (it asks lopdf for `wasm_js`).
pdf-extract = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.22", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
shellexpand = "3.1"
rand = "0.10"
base64 = "0.22"

# Internal crates
localgpt-core = { version = "0.4.0", path = "crates/core" }
localgpt-server = { version = "0.4.0", path = "crates/server" }
localgpt-sandbox = { version = "0.4.0", path = "crates/sandbox" }
localgpt-bridge = { version = "0.4.0", path = "crates/bridge" }
localgpt-world-types = { version = "0.4.0", path = "crates/world-types" }
localgpt-world-export = { version = "0.4.0", path = "crates/world-export" }
localgpt-world-bevy = { version = "0.4.0", path = "crates/world-bevy" }
localgpt-world-audio = { version = "0.4.0", path = "crates/world-audio" }
localgpt-world-sync = { version = "0.4.0", path = "crates/world-sync" }
localgpt-world-editor = { version = "0.4.0", path = "crates/world-editor" }
localgpt-world-agent = { version = "0.4.0", path = "crates/world-agent" }
# Without its `pdf` feature here: Gen stages and boards and needs no PDF
# reader; the previs binary and previs-web turn it on themselves.
localgpt-previs = { version = "0.4.0", path = "crates/previs", default-features = false }
localgpt-cli-tools = { version = "0.4.0", path = "crates/cli-tools" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Bevy's recommended dev profile, carried in from the MD and Verse manifests
# when they joined this workspace: our own crates stay quick to rebuild while
# dependencies are optimised, which is what makes a Bevy app usable in a debug
# build. Profiles only take effect at the workspace root, so this now applies
# to every member — including gen, the third Bevy binary.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

