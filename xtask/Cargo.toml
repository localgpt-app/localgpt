[package]
name = "xtask"
description = "The repository's own tooling, in Rust: `cargo xtask <command>`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
# Where the shared pack lands: the same base localgpt-world-agent's paths
# resolve (`<data dir>/localgpt`), not a copy of the XDG rule.
etcetera = "0.11"
# The live smoke writes a swatch and reads a screenshot back.
png = "0.18"
# The gallery's packages: the canonical manifest text, package.json's record
# and the content hash come from the format's reference crate, not a copy of
# its rules.
openworldformat = { workspace = true }
# A package's transport form, stored the way world-agent writes it.
zip = { version = "9", default-features = false }
