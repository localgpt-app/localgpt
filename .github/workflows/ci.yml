name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:00 UTC: re-run the advisory audit against the current RustSec
    # database, so a new advisory surfaces without waiting for a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A newer push to the same branch supersedes the runs in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic locations and backtraces readable; full debuginfo
  # would double the target directory and overflow the runner's disk and the
  # 10 GB cache on the Bevy builds.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # alsa/udev for bevy_audio and gilrs, wayland for wayland-sys, xkbcommon for
  # winit, fontconfig for bevy_text (fontique), and dbus for kira: its default
  # `cpal-realtime-dbus` asks RtKit over D-Bus to make the audio thread
  # real-time, and without it Linux audio runs at normal priority.
  BEVY_APT_DEPS: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev pkg-config

jobs:
  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Every crate except the ones that need native audio and windowing headers;
  # those are the `bevy` job.
  #
  # Multi-line commands are literal blocks (`|`). In a plain scalar YAML folds
  # the line breaks into spaces, so each `\` escaped a space instead of a
  # newline and cargo rejected " --exclude" — the job failed in seconds from
  # the day it was split across lines.
  clippy:
    name: Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --workspace --exclude localgpt-gen --exclude localgpt-world-bevy \
            --exclude localgpt-md --exclude localgpt-verse \
            --exclude localgpt-world-audio --exclude localgpt-app -- -D warnings

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --workspace --exclude localgpt-gen --exclude localgpt-world-bevy \
            --exclude localgpt-md --exclude localgpt-verse \
            --exclude localgpt-world-audio --exclude localgpt-app
      # world.schema.json must match the types (tests/schema_snapshot.rs).
      - run: cargo test -p localgpt-world-types --features schema

  # The crates that need native audio and windowing headers: the three Bevy
  # binaries, the shared Bevy mapping, and world-audio (kira -> cpal ->
  # alsa-sys). Kept apart because Bevy, avian and lightyear dwarf the rest, and
  # because only this job installs $BEVY_APT_DEPS.
  bevy:
    name: Native deps (app, Gen, MD, Verse, audio)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Bevy + avian + lightyear need more scratch space than the runner image
      # leaves free; drop toolchains this job never uses.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install Bevy build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_APT_DEPS
      - run: cargo clippy -p localgpt-gen -p localgpt-world-bevy -p localgpt-md -p localgpt-verse -p localgpt-world-audio -p localgpt-app -- -D warnings
      - id: test
        run: cargo test -p localgpt-gen -p localgpt-world-bevy -p localgpt-md -p localgpt-verse -p localgpt-world-audio -p localgpt-app
      # Since the Ubuntu 26.04 images, Gen's tests abort with a stack overflow
      # on the thread that opens the audio device. A thread given 8 MiB
      # overflowed as readily as the 2 MiB one, so something recurses, and no
      # Ubuntu 26.04 container reproduces it — bare, with PipeWire's ALSA
      # plugin with and without its daemon, amd64 and arm64, Gen's own test
      # binary included. When the tests fail, Gen's run again under gdb,
      # which stops at the overflow: the innermost frames say what recursed,
      # the outermost how it was entered, and the runner's audio state why
      # only here.
      - name: Where Gen's audio bring-up overflows
        if: failure() && steps.test.outcome == 'failure'
        run: |
          set +e
          echo "::group::Audio on this runner"
          cat /proc/asound/cards; ls -la /dev/snd
          ls -la /etc/alsa/conf.d /usr/share/alsa/alsa.conf.d
          cat /etc/asound.conf ~/.asoundrc ~/.config/alsa/asoundrc
          dpkg -l | grep -E 'pipewire|pulseaudio|wireplumber|jack|libasound'
          env | grep -E '^(XDG_|PULSE|PIPEWIRE|ALSA|DBUS)'
          pgrep -af 'pipewire|pulse|wireplumber'
          echo "::endgroup::"
          sudo apt-get install -y --no-install-recommends gdb > /dev/null
          bin=$(find target/debug/deps -maxdepth 1 -type f -perm -u+x -name 'localgpt_gen-*' | head -1)
          timeout 900 gdb -q -batch -ex 'set pagination off' -ex run -ex 'bt 40' -ex 'bt -15' --args "$bin"

  # The opt-in tiers are compiled by none of the jobs above, so without this
  # the gated code rots broken while default-feature CI stays green. MD and
  # Verse each carried a job like this into the workspace; Gen's `local-llm`
  # had none, and the first run of this one caught a missing dependency in it.
  # Check only, no clippy or tests: these pull heavy native deps, and the lint
  # bar stays on the default build.
  features:
    name: Feature tiers (llm, ml)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install Bevy build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_APT_DEPS
      # mistral.rs, shared by all three: never with `*-metal`, which is
      # macOS-only.
      - run: cargo check -p localgpt-md --features llm
      - run: cargo check -p localgpt-verse --features llm
      - run: cargo check -p localgpt-gen --features local-llm
      # Verse's `ml` tier pins ort =2.0.0-rc.11, which targets ONNX Runtime
      # 1.23; nothing else in the workspace links ONNX Runtime any more, so
      # this job fetches that version for it.
      - name: Cache ONNX Runtime 1.23.2
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: /opt/onnxruntime-1.23
          key: onnxruntime-1.23.2-linux-x64
      - name: Download ONNX Runtime 1.23.2
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -fL "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz" \
            -o /tmp/onnxruntime.tgz
          mkdir -p /opt/onnxruntime-1.23
          tar -xzf /tmp/onnxruntime.tgz --strip-components=1 -C /opt/onnxruntime-1.23
      - run: cargo check -p localgpt-verse --features ml
        env:
          ORT_LIB_LOCATION: /opt/onnxruntime-1.23/lib
          ORT_PREFER_DYNAMIC_LINK: "1"

  # The desktop app's interface: one page (crates/app/ui — React, Tailwind,
  # CodeMirror, xterm.js) over the Bevy viewport, carried inside the release
  # binary, and the design sheets its components are reviewed on before they
  # are wired (docs/rfcs/authoring/the-page.md). The Rust side builds without
  # it — the bevy job's app is a build with no page in it — so the page's
  # types and its build are checked here.
  interface:
    name: The app's interface (page and design sheets)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run design:build

  # The one web renderer. Until localgpt.world folded in here, this check lived
  # in that repository and ran against a *copy* of
  # crates/world-export/js/world-viewer.js — so a change to the canonical
  # renderer could break every published world while this repository's CI stayed
  # green, and on 2026-09-27 the copy was found 185 lines behind. The check now
  # sits next to what it tests.
  #
  # Conformance scenes only: the seven of them reference nothing but the four
  # checker textures in crates/world-types/conformance/assets, so this needs no
  # asset checkout. The curated gallery worlds are checked at deploy, where
  # their GLBs are (`npm run check:all`).
  viewer:
    name: Web viewer and localgpt.md page
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website-world/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The renderer is the published openworldformat one, vendored — a hand
      # edit or a forgotten sync fails here before anything renders.
      - name: Viewer is the published openworldformat renderer
        run: ./scripts/sync-viewer.sh --check
      # The one web renderer, gated on the crates that own it.
      - name: world-viewer conformance render
        working-directory: website-world
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
      # The localgpt.md page: drop a screenplay (Fountain, then the same one
      # as Markdown), require the board's frames and the package downloads.
      - name: localgpt.md page check
        working-directory: website-md
        run: |
          npm ci
          npm run assemble
          npx --no-install playwright install --with-deps chromium
          npm run check

  # Licenses, bans and sources only change with Cargo.lock and deny.toml, so
  # they gate every change.
  deps:
    name: Dependency policy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # RustSec advisories change with the database, not with this repo: they run
  # on main and weekly, and never block a pull request on code that didn't move.
  advisories:
    name: Security advisories
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
