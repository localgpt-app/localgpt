name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:00 UTC: re-run the advisory audit against the current RustSec
    # database, so a new advisory surfaces without waiting for a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A newer push to the same branch supersedes the runs in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic locations and backtraces readable; full debuginfo
  # would double the target directory and overflow the runner's disk and the
  # 10 GB cache on the Bevy builds.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Same list as Verse and MD: alsa/udev for bevy_audio and gilrs, wayland for
  # wayland-sys, xkbcommon for winit, fontconfig for bevy_text (fontique).
  BEVY_APT_DEPS: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev pkg-config

jobs:
  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Every crate except the two that need Bevy; those are the `gen` job.
  clippy:
    name: Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/onnxruntime
      - run: cargo clippy --workspace --exclude localgpt-gen --exclude localgpt-world-bevy -- -D warnings

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/onnxruntime
      - run: cargo test --workspace --exclude localgpt-gen --exclude localgpt-world-bevy
      # world.schema.json must match the types (tests/schema_snapshot.rs).
      - run: cargo test -p localgpt-world-types --features schema

  # The Bevy crates: the Gen binary and the shared Bevy mapping. Kept apart
  # because they compile Bevy, avian and lightyear, which dwarfs the rest.
  gen:
    name: Gen (Bevy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Bevy + avian + lightyear + core's ONNX stack need more scratch space
      # than the runner image leaves free; drop toolchains this job never uses.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install Bevy build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BEVY_APT_DEPS
      - uses: ./.github/actions/onnxruntime
      - run: cargo clippy -p localgpt-gen -p localgpt-world-bevy -- -D warnings
      - run: cargo test -p localgpt-gen -p localgpt-world-bevy

  # Licenses, bans and sources only change with Cargo.lock and deny.toml, so
  # they gate every change.
  deps:
    name: Dependency policy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # RustSec advisories change with the database, not with this repo: they run
  # on main and weekly, and never block a pull request on code that didn't move.
  advisories:
    name: Security advisories
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
