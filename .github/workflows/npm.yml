# The `localgpt` npm package: the command line, prebuilt, so that
# `npm install -g localgpt` and `npx -y localgpt world mcp` need no Rust.
#
# A `vX.Y.Z` tag publishes it, beside the crates (release.yml; neither waits
# for the other). Run by hand it is a rehearsal, and publishes only when told
# to:
#   gh workflow run npm.yml                                # build, pack, install, run; publish nothing
#   gh workflow run npm.yml --ref vX.Y.Z -f publish=true   # a release whose own run failed
#
# It builds `localgpt` for five platforms without the audio models (they link
# ONNX Runtime, which has no build for an Intel Mac and asks a newer Linux
# than the rest does); packs the five into one package (cargo xtask
# npm-package, which on a tag's run refuses a tag that is not the workspace's
# version); installs that tarball on each of the five and runs what it
# installed; and only then publishes the same tarball. Either way the tarball
# is kept, as the `npm-package` artifact, with the Homebrew formula that
# installs from it (cargo xtask formula), which the install job also tries.
#
# Credentials: npm's trusted publishing, and nothing else. No token lives
# in the repository, as a secret or otherwise, and npm records where the
# package was built. On npmjs.com, in the package's Settings > Trusted
# Publisher > GitHub Actions: organization `localgpt-app`, repository
# `localgpt`, workflow `npm.yml`, environment `npm`, with `npm publish`
# allowed. The publish job never guesses: where npm refuses the publish, it
# fails and says how a person publishes this run's tarball; run again, it
# finds the version up and checks that it is that tarball
# (docs/releasing.md, "The npm package").
name: npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (off: build, pack, install and run only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: localgpt (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest, bin: localgpt }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-15-intel, bin: localgpt }
          # Ubuntu 22.04 for its glibc: what is linked there asks for 2.34
          # (the build prints it), which Ubuntu 22.04, Debian 12, RHEL 9 and
          # everything newer have.
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bin: localgpt }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, bin: localgpt }
          # The C runtime linked in, so a Windows without the Visual C++
          # redistributable runs it.
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest, bin: localgpt.exe, rustflags: "-C target-feature=+crt-static" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: npm-${{ matrix.target }}

      - name: Build localgpt
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p localgpt --target ${{ matrix.target }}

      - name: It runs where it was built
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - name: What the Linux binary asks of a system
        if: runner.os == 'Linux'
        run: |
          bin=target/${{ matrix.target }}/release/localgpt
          objdump -p "$bin" | grep NEEDED
          echo "glibc: $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: localgpt-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          overwrite: true

  pack:
    name: Pack
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: localgpt-*
          path: dist/binaries

      - name: One package, every platform in it
        run: |
          cargo xtask npm-package dist/binaries dist/npm
          cd dist/npm
          npm pack
          tar -tzvf localgpt-*.tgz

      # Homebrew's formula for the command line installs out of this
      # tarball, so it is rendered here, with the tarball's own checksum.
      - name: The Homebrew formula that installs from it
        run: |
          tarball=$(ls dist/npm/localgpt-*.tgz)
          version=${tarball#dist/npm/localgpt-}
          version=${version%.tgz}
          cargo xtask formula "$version" "$tarball" > dist/npm/localgpt.rb
          cat dist/npm/localgpt.rb

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            dist/npm/localgpt-*.tgz
            dist/npm/localgpt.rb
          if-no-files-found: error
          overwrite: true

      # The publish job's own steps, short of the upload, so a rehearsal
      # tries the npm that will publish and the command it will be given.
      - name: What a publish would send
        run: |
          npm install -g npm@latest
          npm --version
          npm publish dist/npm/localgpt-*.tgz --access public --dry-run

  # The tarball that would be published, installed the way a person installs
  # it, on each platform it claims.
  install:
    name: Install and run (${{ matrix.platform }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # `brew`: where the runner has Homebrew, the formula is tried too.
          - { platform: darwin-arm64, os: macos-latest, brew: true }
          - { platform: darwin-x64, os: macos-15-intel, brew: true }
          - { platform: linux-x64, os: ubuntu-22.04, brew: true }
          - { platform: linux-arm64, os: ubuntu-22.04-arm }
          - { platform: win32-x64, os: windows-latest }
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Install the tarball and run what it installed
        shell: bash
        run: |
          tarball=$(ls localgpt-*.tgz)
          version=${tarball#localgpt-}
          version=${version%.tgz}
          prefix="$RUNNER_TEMP/npm-global"
          npm install -g --prefix "$prefix" "./$tarball"
          bin="$prefix/bin"; [ -d "$bin" ] || bin="$prefix"

          test "$("$bin/localgpt" --version)" = "localgpt $version"
          "$bin/localgpt" world init "$RUNNER_TEMP/smoke.world"
          "$bin/localgpt" world verify "$RUNNER_TEMP/smoke.world"

          # The binary's exit status and its stderr are the launcher's: this
          # build has no audio models, and says so with status 1.
          set +e
          "$bin/localgpt" audio mcp > said.txt 2>&1; status=$?
          set -e
          cat said.txt
          test "$status" = 1
          grep -q "built without the audio models" said.txt

          # And with nothing installed, as an MCP configuration's
          # `npx -y localgpt world mcp` starts it.
          test "$(npx -y "./$tarball" --version)" = "localgpt $version"

      - name: The same through cmd.exe's shim
        if: runner.os == 'Windows'
        shell: cmd
        run: '"%RUNNER_TEMP%\npm-global\localgpt.cmd" --version'

      # The formula as the tap will carry it, but for its URL: npm does not
      # serve this tarball yet, so it is read from here. Installed from a tap
      # the way `brew install localgpt-app/tap/localgpt` installs it, and put
      # through its own test.
      - name: The same through Homebrew's formula
        if: matrix.brew
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          # A Linux runner has Homebrew, off the PATH.
          if ! command -v brew > /dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          tarball=$(ls localgpt-*.tgz)
          version=${tarball#localgpt-}
          version=${version%.tgz}
          grep -q "https://registry.npmjs.org/localgpt/-/$tarball" localgpt.rb
          brew tap-new --no-git localgpt-app/rehearsal
          formulae="$(brew --repository localgpt-app/rehearsal)/Formula"
          mkdir -p "$formulae"
          sed "s|https://registry.npmjs.org/localgpt/-/|file://$PWD/|" localgpt.rb > "$formulae/localgpt.rb"
          brew install localgpt-app/rehearsal/localgpt
          brew test localgpt-app/rehearsal/localgpt
          test "$("$(brew --prefix)/bin/localgpt" --version)" = "localgpt $version"

      # Node's Debian 12 image, where a web developer's container starts, and
      # Alpine, which has no glibc: there the launcher has to say so, where
      # the system would only say "not found".
      - name: The same in node's Debian and Alpine images
        if: matrix.platform == 'linux-x64'
        run: |
          docker run --rm -v "$PWD:/w:ro" node:22-bookworm-slim sh -ec '
            npm install -g /w/localgpt-*.tgz > /dev/null
            localgpt --version
            localgpt world init /tmp/smoke.world
            localgpt world verify /tmp/smoke.world'
          docker run --rm -v "$PWD:/w:ro" node:22-alpine sh -c '
            npm install -g /w/localgpt-*.tgz > /dev/null
            localgpt --version' > alpine.txt 2>&1 || true
          cat alpine.txt
          grep -q -e "needs glibc" -e "^localgpt [0-9]" alpine.txt

  publish:
    name: Publish to npm
    needs: install
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/localgpt
    permissions:
      contents: read
      id-token: write # the trusted publisher's exchange, and the provenance statement
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      # Trusted publishing needs npm 11.5.1, newer than node 22 brings.
      - run: npm install -g npm@latest

      - name: Publish
        run: |
          tarball=$(ls localgpt-*.tgz)
          version=${tarball#localgpt-}
          version=${version%.tgz}
          # A pre-release (a hyphen in the version) is `next`, never `latest`.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          registry=https://registry.npmjs.org/localgpt
          ours="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"

          # What npm has of a URL: 200, 404, or an answer this job stops at.
          asked() {
            status=$(curl -sS -o "$2" -w '%{http_code}' "$1")
            case "$status" in
              200 | 404) ;;
              *) echo "::error::$1 answered $status"; exit 1 ;;
            esac
          }

          # Where this job cannot publish, a person can: the tarball is this
          # run's artifact, installed and run on every platform above.
          by_hand() {
            {
              echo "### localgpt $version is not on npm"
              echo
              echo "$1"
              echo
              echo "This run's tarball is the one it installed and ran on every platform. With your own npm login:"
              echo
              echo '```bash'
              echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name npm-package --dir localgpt-npm"
              echo "npm publish localgpt-npm/$tarball --access public --tag $tag"
              echo "gh run rerun $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --failed   # checks that npm has this tarball"
              echo '```'
              echo
              echo 'Then the trusted publisher, so that the next version needs no one: docs/releasing.md, "The npm package".'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Not on npm::$1 A person publishes this run's tarball: the commands are in this run's summary and in docs/releasing.md."
            exit 1
          }

          # A rerun after the upload went through, or after a person
          # published the tarball, has nothing to send: it says whose it is.
          asked "$registry/$version" up.json
          if [ "$status" = 200 ]; then
            theirs=$(jq -r .dist.integrity up.json)
            if [ "$theirs" = "$ours" ]; then
              echo "localgpt@$version is up, and it is this run's tarball: $ours"
            else
              echo "::warning::localgpt@$version is up from another build: npm has $theirs, this run packed $ours"
            fi
            exit 0
          fi

          # No token: the trusted publisher is the whole of the credentials,
          # and it brings the provenance statement.
          npm publish "$tarball" --access public --provenance --tag "$tag" ||
            by_hand "npm refused the publish. Its trusted publisher for localgpt has to name this repository, npm.yml and the npm environment, allow npm publish, and be no more than two days old at its first publish."
