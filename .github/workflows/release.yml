# Publish the workspace's crates to crates.io when a release tag is pushed.
#
# A release is cut locally as before, with --workspace on every cargo-release
# step that selects packages (the root's `default-members` is the CLI alone,
# so without it cargo-release selects only `localgpt`); `commit` takes none:
#   cargo release version X.Y.Z --workspace --execute
#   cargo release commit --execute
#   git tag -s vX.Y.Z -m vX.Y.Z
#   git push origin main vX.Y.Z
# and this job does the rest. It refuses a tag that is not the workspace's
# version; asks crates.io which crates are already up at that version
# (cargo xtask release-plan), so a rerun after a partial publish finishes
# the release instead of failing on the first crate already there — after
# crates.io's limit on new crates, or after cargo gave up waiting for an
# upload to reach the index before publishing what depends on it, which
# cost 0.4.2 its last two crates (the wait is a minute, and `publish.timeout`
# is still unstable, so it can't be lengthened); builds every remaining
# crate from its package; and only then uploads them, in dependency order.
#
# Credentials: Trusted Publishing, so no token lives in the repository.
# crates.io issues a short-lived token because each crate's settings name
# this repository, this workflow file and the `crates-io` environment. Set
# it up once per crate on crates.io, Settings > Trusted Publishing > GitHub:
# owner `localgpt-app`, repository `localgpt`, workflow `release.yml`,
# environment `crates-io`. crates.io allows that only for a crate that
# already exists, so a crate's first release needs an API token instead:
# put one with the publish-new and publish-update scopes in the
# `CARGO_REGISTRY_TOKEN` secret and it is used in place of the exchange.
# Delete the secret once every crate trusts this workflow.
name: Release

on:
  push:
    tags: ["v*"]
  # Publish whatever is not yet up at the version on the chosen ref: for a
  # rerun, or a release tagged on a commit that predates this file.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  BEVY_APT_DEPS: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev pkg-config

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: crates-io
      url: https://crates.io/crates/localgpt
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges; nothing else
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: The tag names the workspace version
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag says ${GITHUB_REF_NAME#v}, Cargo.toml says $version"
            exit 1
          fi

      - name: What crates.io already has
        id: plan
        run: cargo xtask release-plan

      # Building gen, world-bevy and world-audio from their packages needs
      # the same scratch space and system packages as CI's native-deps job.
      - name: Free runner disk
        if: steps.plan.outputs.remaining != '0'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install Bevy build deps
        if: steps.plan.outputs.remaining != '0'
        run: |
          read -ra deps <<< "$BEVY_APT_DEPS"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends "${deps[@]}"

      - name: Package and build every remaining crate from its package
        if: steps.plan.outputs.remaining != '0'
        env:
          EXCLUDES: ${{ steps.plan.outputs.excludes }}
        run: |
          read -ra excludes <<< "$EXCLUDES"
          cargo publish --workspace --dry-run "${excludes[@]}"

      # The token comes after the long build, since it is short-lived.
      - name: A short-lived token from crates.io
        id: auth
        if: steps.plan.outputs.remaining != '0' && env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Upload
        if: steps.plan.outputs.remaining != '0'
        env:
          EXCLUDES: ${{ steps.plan.outputs.excludes }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          read -ra excludes <<< "$EXCLUDES"
          cargo publish --workspace --no-verify "${excludes[@]}"

  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, bin: localgpt }
          - { target: x86_64-apple-darwin, os: macos-15-intel, bin: localgpt }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, bin: localgpt }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, bin: localgpt }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: localgpt.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build localgpt
        run: cargo build --release -p localgpt --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance when NPM_TOKEN is configured
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/binaries

      - name: Assemble npm packages
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          cargo xtask npm-package "$version" dist/binaries dist/npm

      - uses: actions/upload-artifact@v4
        with:
          name: localgpt-npm
          path: dist/npm
          if-no-files-found: error

      - name: Publish platform and root packages to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in dist/npm/cli-* dist/npm/localgpt; do
            name="$(node -p 'require("./" + process.argv[1] + "/package.json").name' "$pkg")"
            version="$(node -p 'require("./" + process.argv[1] + "/package.json").version' "$pkg")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "up already  $name@$version"
            else
              echo "publishing  $name@$version"
              npm publish "./$pkg" --access public --provenance
            fi
          done
