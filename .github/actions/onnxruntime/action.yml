name: ONNX Runtime
description: >-
  Install ONNX Runtime under /opt/onnxruntime (cached between runs), register
  it with the dynamic linker and point ort-sys at it, so builds never try to
  reach cdn.pyke.io, which GitHub-hosted runners can't. The version must be
  the one the workspace's ort-sys targets (its build/download/dist.txt), or
  the runtime rejects the API level at startup ("Failed to initialize ORT
  API"): ort-sys 2.0.0-rc.12 with api-24 needs 1.24.x.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache
      with:
        path: /opt/onnxruntime
        key: onnxruntime-1.24.2-linux-x64
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fL "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz" \
          -o /tmp/onnxruntime.tgz
        mkdir -p /opt/onnxruntime
        tar -xzf /tmp/onnxruntime.tgz --strip-components=1 -C /opt/onnxruntime
    - shell: bash
      run: |
        echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf && sudo ldconfig
        echo "ORT_LIB_LOCATION=/opt/onnxruntime/lib" >> "$GITHUB_ENV"
        echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
