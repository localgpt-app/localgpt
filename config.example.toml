# LocalGPT Configuration
# Copy to ~/.config/localgpt/config.toml
#
# Environment Variables:
#   LOCALGPT_PROFILE=work     - Profile isolation (suffixes all XDG dirs)
#                                ~/.config/localgpt-work/
#                                ~/.local/share/localgpt-work/
#                                ~/.local/state/localgpt-work/
#                                ~/.cache/localgpt-work/
#   LOCALGPT_WORKSPACE=/path  - Override workspace directory
#   LOCALGPT_CONFIG=/path     - Override config file path
#   LOCALGPT_AGENT=main       - Agent ID (default: "main")

[agent]
# Default model to use for chat
#
# Format: "provider/model-id" (OpenClaw-compatible)
#
# LM Studio (local, no API key needed):
#   - "openai/qwen/qwen3.5-35b-a3b", "openai/llama-4-scout", etc.
#   (requires LM Studio running at http://127.0.0.1:1234)
#
# Ollama (local, no API key needed):
#   - "ollama/llama3", "ollama/mistral", etc.
#
# Claude CLI (local, no API key needed):
#   - "claude-cli/opus", "claude-cli/sonnet", "claude-cli/haiku"
#
# Gemini CLI (local, no API key needed):
#   - "gemini-cli/gemini-3.1-pro-preview", "gemini-cli/gemini-3.1-flash"
#
# Codex CLI (local, no API key needed):
#   - "codex-cli/gpt-4o", "codex-cli/o1"
#
# Anthropic API (requires ANTHROPIC_API_KEY):
#   - "anthropic/claude-opus-4-5", "anthropic/claude-sonnet-4-5"
#
# OpenAI API (requires OPENAI_API_KEY):
#   - "openai/gpt-4o", "openai/gpt-4o-mini", "openai/gpt-4-turbo"
#
# xAI API (requires XAI_API_KEY):
#   - "xai/grok-3-mini", "xai/grok-3"
#
# GLM / Z.AI API (requires GLM API key):
#   - "glm/glm-4.7" (or use alias "glm")
#
# Vertex AI (requires service account key):
#   - "vertex/claude-opus-4-6", "vertex/gemini-2.0-flash"
#
# OpenAI Compatible (requires base_url):
#   - "openai-compatible/deepseek-coder"
#
# Short aliases (auto-resolved):
#   - "opus"   → anthropic/claude-opus-4-5
#   - "sonnet" → anthropic/claude-sonnet-4-5
#   - "gpt"    → openai/gpt-4o
#
default_model = "claude-cli/opus"

# Context window size (in tokens)
context_window = 128000

# Reserve tokens for response
reserve_tokens = 8000

# LM Studio (local models, no API key needed)
# Download from https://lmstudio.ai, load a model, and start the local server.
# [providers.openai]
# api_key = "lm-studio"
# base_url = "http://127.0.0.1:1234/v1"

# Ollama configuration (for local models)
# [providers.ollama]
# endpoint = "http://localhost:11434"
# model = "llama3"

# Anthropic configuration (for cloud API)
# Get your API key at: https://console.anthropic.com/
[providers.anthropic]
api_key = "${ANTHROPIC_API_KEY}"  # Set: export ANTHROPIC_API_KEY="sk-ant-..."
base_url = "https://api.anthropic.com"

# OpenAI configuration (optional)
# [providers.openai]
# api_key = "${OPENAI_API_KEY}"
# base_url = "https://api.openai.com/v1"

# For other local OpenAI-compatible servers (llamafile, vLLM):
# api_key = "not-needed"
# base_url = "http://127.0.0.1:8080/v1"

# xAI configuration (optional, for xai/* models)
# [providers.xai]
# api_key = "${XAI_API_KEY}"
# base_url = "https://api.x.ai/v1"

# Claude CLI configuration (uses local claude CLI command)
# Requires claude CLI to be installed: https://github.com/anthropics/claude-code
# [providers.claude_cli]
# command = "claude"
# model = "opus"  # opus, sonnet, or haiku
# effort = "max"  # low, medium, high, max (default: max)
# builtin_tools = ""  # restrict Claude CLI's built-in tools (--tools); "" = none, MCP only

# Gemini CLI configuration (uses local gemini CLI command)
# Requires gemini CLI to be installed: https://github.com/google/gemini-cli
# [providers.gemini_cli]
# command = "gemini"
# model = "gemini-3.1-pro-preview"

# Codex CLI configuration (uses local codex CLI command)
# Requires codex CLI to be installed
# [providers.codex_cli]
# command = "codex"
# model = "gpt-4o"

# Generic OpenAI-compatible provider (OpenRouter, DeepSeek, Groq, etc.)
# [providers.openai_compatible]
# api_key = "${OPENROUTER_API_KEY}"
# base_url = "https://openrouter.ai/api/v1"

# GLM / Z.AI configuration (optional)
# Get your API key at: https://z.ai/manage-apikey/apikey-list
# [providers.glm]
# api_key = "${GLM_API_KEY}"
# base_url = "https://api.z.ai/api/coding/paas/v4"

# Gemini API key configuration (simplest way to use Gemini)
# Get your API key at: https://aistudio.google.com/app/apikey
# [providers.gemini]
# api_key = "${GEMINI_API_KEY}"
# base_url = "https://generativelanguage.googleapis.com"

# Google Vertex AI configuration (service account authentication)
# Access Claude and Gemini models via Google Cloud's enterprise platform
# 1. Create a service account in Google Cloud Console
# 2. Grant "Vertex AI User" role
# 3. Download the JSON key file
# [providers.vertex]
# service_account_key = "~/.config/gcloud/service-account.json"  # supports ~ and ${ENV}
# project_id = "${GOOGLE_CLOUD_PROJECT}"
# location = "us-central1"  # default; use "global" for global endpoint
#
# Usage: vertex/claude-opus-4-6, vertex/gemini-2.0-flash

[memory]
# Where to store memory files
# workspace = "~/.local/share/localgpt/workspace"

# Search is by keyword (SQLite FTS5). An embeddings API adds vectors:
# - "none": keyword search only (default)
# - "openai": OpenAI embeddings (requires providers.openai config)
# - "gemini": Gemini embeddings (memory.gemini_api_key or providers.gemini)
embedding_provider = "none"

# For OpenAI: text-embedding-3-small (default), text-embedding-3-large
# embedding_model = "text-embedding-3-small"

# Chunk size for indexing (tokens)
chunk_size = 400

# Overlap between chunks (tokens)
chunk_overlap = 80

# Web search (optional)
# [tools.web_search]
# provider = "searxng"            # searxng | brave | tavily | perplexity | none
# cache_enabled = true
# cache_ttl = 900                 # seconds (default: 15 min)
# max_results = 5                 # 1-10
# prefer_native = true            # use provider-native search if available
#
# [tools.web_search.searxng]
# base_url = "http://localhost:8080"
# categories = "general"
# language = "en"
# time_range = ""                 # day | week | month | year | ""
#
# [tools.web_search.brave]
# api_key = "${BRAVE_API_KEY}"
# country = ""
# freshness = ""                  # pd | pw | pm | ""
#
# [tools.web_search.tavily]
# api_key = "${TAVILY_API_KEY}"
# search_depth = "basic"          # basic | advanced
# include_answer = true
#
# [tools.web_search.perplexity]
# api_key = "${PERPLEXITY_API_KEY}"
# model = "sonar"                 # sonar | sonar-pro | sonar-reasoning-pro

[security]
# LocalGPT injects a security block at the end of every LLM context window.
# The block has two independent layers:
#
#   1. User policy (POLICY.md) — your custom instructions, sanitized
#      before injection. Injected as "## Workspace Security Policy" header
#      followed by your content. Changes take effect on the next session.
#
#   2. Hardcoded suffix — a compiled-in security reminder that tells the model
#      to treat tool outputs and retrieved content as data, not instructions.
#      This is the last thing the model sees before generating a response.
#
# Both are concatenated into the last user message on every API call.
# They are NOT saved to session logs or included in compaction.
#
# You can disable each layer independently:

# Skip loading the POLICY.md workspace security policy (default: false)
# The hardcoded suffix still applies unless also disabled.
# disable_policy = false

# Skip the hardcoded security suffix (default: false)
# The user policy still applies unless also disabled.
# WARNING: Disabling both disable_policy and disable_suffix removes all
# end-of-context security reinforcement. The system prompt safety section
# still exists but may lose effectiveness in long sessions due to the
# "lost in the middle" attention decay.
# disable_suffix = false

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log directory (logs are written as localgpt-YYYY-MM-DD.log)
path = "~/.local/state/localgpt/logs"
