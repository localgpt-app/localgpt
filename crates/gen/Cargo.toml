[package]
name = "localgpt-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LocalGPT Gen — AI-driven 3D scene generation"
readme = "README.md"
keywords = ["ai", "3d", "scene-generation", "bevy", "localgpt"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "localgpt-gen"
path = "src/main.rs"

[dependencies]
localgpt-core = { workspace = true, features = ["mcp-http"] }
localgpt-world-types = { workspace = true }
localgpt-cli-tools = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

clap = { version = "4.6", features = ["derive"] }

# 3D generation via Bevy
bevy = "0.19"
bevy_egui = "0.40"
image = "0.25"

# glTF/GLB export
gltf-json = { version = "1", features = ["names"] }

# Path resolution
shellexpand = { workspace = true }

# CLI line editor
rustyline = "18"

# Procedural audio (environmental soundscapes)
fundsp = "0.23"
cpal = "0.18"

# World skill serialization
ron = "0.12.1"

# Content hashing for sync/drift detection
sha2 = "0.11"
hex = "0.4"

# Timestamps for experiment tracking
chrono = { workspace = true }

# File locking for GPU exclusivity (unix only, used by gpu_lock)
libc = "0.2"

# WebSocket inspector protocol (Spec 0.6)
axum = { version = "0.8", features = ["ws"] }

# Physics (P5): avian3d 0.7 targets Bevy 0.19.
avian3d = { version = "0.7", optional = true }

# Floating character controller (P1): bevy-tnua + bevy-tnua-avian3d.
# BLOCKED on Bevy 0.19 — the latest releases (bevy-tnua 0.31 / bevy-tnua-avian3d
# 0.11) still target Bevy 0.18, and two Bevy versions cannot link into one
# binary. Gated behind the off-by-default `character-controller` feature; the
# player falls back to a transform-based controller until upstream ships 0.19.
# Re-enable the `character-controller` feature once those crates support 0.19.
bevy-tnua = { version = "0.31", optional = true }
bevy-tnua-avian3d = { version = "0.11", optional = true }

# Noise for procedural terrain (P3)
noise = "0.9"

# Interpolation for animations
splines = "5.0"

# Random number generation (for NPC wander, foliage scattering)
rand = { workspace = true }
lightyear = { version = "0.30.1", optional = true, default-features = false, features = [
    "std",
    "client",
    "server",
    "replication",
    "interpolation",
    "netcode",
    "udp",
] }
# Replication rule customization (JSON rule fns for world-types payloads).
# Versions unify with lightyear's dependency graph.
bevy_replicon = { version = "0.44", optional = true }
bytes = { version = "1", optional = true }
mdns-sd = { version = "0.21.3", optional = true }

# File locking for GPU exclusivity (Windows)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[features]
default = ["physics", "multiplayer"]
# Avian3d rigid-body physics, colliders, joints, forces, gravity, spatial
# queries (camera spring-arm). Works on Bevy 0.19.
physics = ["dep:avian3d"]
# Phase-1 collaborative listen server: lightyear netcode + mDNS discovery
# (§1 of docs/rfcs/multiplayer/collaborative-world-engine-architecture.md).
# `--host` / `--join` require this feature.
multiplayer = [
    "dep:lightyear",
    "dep:bevy_replicon",
    "dep:bytes",
    "dep:mdns-sd",
]
# bevy-tnua floating character controller for the player. Requires `physics`.
# OFF by default: no Bevy 0.19-compatible bevy-tnua release exists yet, so
# enabling this currently fails to build. When enabled the player uses the
# Tnua walk/jump controller; otherwise a transform-based controller is used.
character-controller = ["physics", "dep:bevy-tnua", "dep:bevy-tnua-avian3d"]
