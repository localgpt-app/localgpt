[package]
name = "localgpt-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LocalGPT Gen — AI-driven 3D scene generation"
readme = "README.md"
keywords = ["ai", "3d", "scene-generation", "bevy", "localgpt"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "localgpt-gen"
path = "src/main.rs"

[dependencies]
localgpt-core = { workspace = true, features = ["mcp-http"] }
localgpt-world-types = { workspace = true }
localgpt-world-export = { workspace = true }
localgpt-world-sync = { workspace = true, optional = true }
localgpt-world-bevy = { workspace = true }
localgpt-cli-tools = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

clap = { version = "4.6", features = ["derive"] }

# 3D generation via Bevy
bevy = "0.19"
bevy_egui = "0.40"
image = "0.25"

# glTF/GLB export
gltf-json = { version = "1", features = ["names"] }

# Path resolution
shellexpand = { workspace = true }

# CLI line editor
rustyline = "18"

# Procedural audio (environmental soundscapes)
fundsp = "0.23"
cpal = "0.18"

# World skill serialization
ron = "0.12.1"

# Content hashing for sync/drift detection
sha2 = "0.11"
hex = "0.4"

# Timestamps for experiment tracking
chrono = { workspace = true }

# File locking for GPU exclusivity (unix only, used by gpu_lock)
libc = "0.2"

# WebSocket inspector protocol (Spec 0.6)
axum = { version = "0.8", features = ["ws"] }

# Native ops client (--join): plain-WebSocket client to the host's /session
tokio-tungstenite = { version = "0.29", default-features = false, optional = true }

# Physics (P5): avian3d 0.7 targets Bevy 0.19.
avian3d = { version = "0.7", optional = true }

# Floating character controller (P1): bevy-tnua + bevy-tnua-avian3d.
# BLOCKED on Bevy 0.19 — the latest releases (bevy-tnua 0.31 / bevy-tnua-avian3d
# 0.11) still target Bevy 0.18, and two Bevy versions cannot link into one
# binary. Gated behind the off-by-default `character-controller` feature; the
# player falls back to a transform-based controller until upstream ships 0.19.
# Re-enable the `character-controller` feature once those crates support 0.19.
bevy-tnua = { version = "0.31", optional = true }
bevy-tnua-avian3d = { version = "0.11", optional = true }

# Noise for procedural terrain (P3)
noise = "0.9"

# Interpolation for animations
splines = "5.0"

# Random number generation (for NPC wander, foliage scattering)
rand = { workspace = true }
mdns-sd = { version = "0.21.3", optional = true }
# Base64 panoramas (gen_panorama_to_world).
base64 = "0.22"
# `local-llm`: in-process GGUF inference (same version LocalGPT MD and Verse
# use, so their verified constraints hold here too).
mistralrs = { version = "0.8", optional = true }
# Names mistral.rs's message type in src/local_llm.rs's request wrapper.
indexmap = { version = "2", optional = true }

# File locking for GPU exclusivity (Windows)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.27"

[features]
default = ["physics", "multiplayer"]
# Avian3d rigid-body physics, colliders, joints, forces, gravity, spatial
# queries (camera spring-arm). Works on Bevy 0.19.
physics = ["dep:avian3d"]
# Collaborative rooms over the ops protocol (world-sync over WebSocket),
# with mDNS discovery. `--host` / `--join` require this feature.
multiplayer = [
    "dep:mdns-sd",
    "dep:localgpt-world-sync",
    "dep:tokio-tungstenite",
]
# In-process local LLM: runs a GGUF model through mistral.rs as the
# `gguf/<name>` provider (src/local_llm.rs), reading the model directory
# LocalGPT's apps share (~/.local/share/localgpt/models/llm), so the model
# fetched for MD or Verse is reused. Off by default: mistral.rs is a large
# build, and a ~5 GB model wants the GPU path below.
local-llm = ["dep:mistralrs", "dep:indexmap"]
# Apple-Silicon GPU path for `local-llm` (macOS only: never enable it in the
# Linux CI job). The CPU device map can't hold a 5 GB Q4_K_M beside the
# renderer on a 32 GB Mac.
local-llm-metal = ["local-llm", "mistralrs/metal"]
# bevy-tnua floating character controller for the player. Requires `physics`.
# OFF by default: no Bevy 0.19-compatible bevy-tnua release exists yet, so
# enabling this currently fails to build. When enabled the player uses the
# Tnua walk/jump controller; otherwise a transform-based controller is used.
character-controller = ["physics", "dep:bevy-tnua", "dep:bevy-tnua-avian3d"]
