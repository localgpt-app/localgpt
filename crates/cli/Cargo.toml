[package]
name = "localgpt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LocalGPT's command line: a .world package's authority, and the MCP shim that gives any agent tools against an open world"
readme = "../../README.md"
keywords = ["world", "mcp", "agents", "3d", "openworldformat"]
categories = ["command-line-utilities"]

[[bin]]
name = "localgpt"
path = "src/main.rs"

[dependencies]
# The shim stands on core's stdio MCP server and `Tool` trait until they move
# to world-agent (docs/rfcs/authoring/the-harness-goes.md, "What moves out of
# core first"). No default features: none of the assistant's providers is
# wanted here.
localgpt-core = { workspace = true, default-features = false }
# The world authority, for `localgpt world`. Bevy-free, so the CLI stays light.
localgpt-world-agent = { workspace = true }
# The view, for `localgpt world tips` and the ids in `world log`: the CLI
# composes authority and view, because the authority must not know its viewers.
localgpt-world-editor = { workspace = true }

tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"

[dev-dependencies]
tempfile = "3.27"
