[package]
name = "localgpt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LocalGPT's command line: a .world package's authority, the MCP shim that gives any agent tools against an open world, and deterministic screenplay-to-previs"
readme = "../../README.md"
keywords = ["world", "mcp", "agents", "3d", "openworldformat"]
categories = ["command-line-utilities"]

[[bin]]
name = "localgpt"
path = "src/main.rs"

[dependencies]
# The world authority, for `localgpt world`, and the `Tool` trait and stdio
# MCP server the shim serves its eight tools through. Bevy-free, so the CLI
# stays light.
localgpt-world-agent = { workspace = true, features = ["mcp"] }
# The view, for `localgpt world tips` and the ids in `world log`: the CLI
# composes authority and view, because the authority must not know its viewers.
localgpt-world-editor = { workspace = true }
# Screenplay → per-scene .world packages, shot list and board, for
# `localgpt previs` (Fountain, Final Draft .fdx, PDF and Markdown pages).
localgpt-previs = { workspace = true, features = ["pdf"] }

tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"

[dev-dependencies]
tempfile = "3.27"
