[package]
name = "localgpt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LocalGPT's command line: a .world package's authority, the MCP shim that gives any agent tools against an open world, and deterministic screenplay-to-previs"
readme = "../../README.md"
keywords = ["world", "mcp", "agents", "3d", "openworldformat"]
categories = ["command-line-utilities"]

[[bin]]
name = "localgpt"
path = "src/main.rs"

[features]
default = []
# `localgpt audio`: install the optional audio-analysis models and run them,
# and their tools in `world mcp` once installed. Asked for, not default: it
# links ONNX Runtime, which has no build for an Intel Mac and whose Linux
# build needs glibc 2.38, and `cargo install localgpt` has to work there
# too. `cargo xtask bundle` turns it on for the `localgpt` inside
# LocalGPT.app, CI lints and tests with it on, and the npm package is built
# without it.
audio = ["dep:localgpt-audio-models"]

[dependencies]
# The world authority, for `localgpt world`, and the `Tool` trait and stdio
# MCP server the shim serves its tools through. Bevy-free, so the CLI
# stays light.
localgpt-world-agent = { workspace = true, features = ["mcp"] }
# The view, for `localgpt world tips` and the ids in `world log`: the CLI
# composes authority and view, because the authority must not know its viewers.
localgpt-world-editor = { workspace = true }
# Screenplay → per-scene .world packages, shot list and board, for
# `localgpt previs` (Fountain, Final Draft .fdx, PDF and Markdown pages).
localgpt-previs = { workspace = true, features = ["pdf"] }
# `localgpt audio`, and the installed models' tools in `world mcp`.
localgpt-audio-models = { workspace = true, features = ["mcp"], optional = true }

tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# `world link`: the manifest, raw DEFLATE, base64url, in a URL's fragment.
flate2 = "1"
base64 = { workspace = true }

clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"

[dev-dependencies]
tempfile = "3.27"
