[package]
name = "localgpt-previs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LocalGPT Previs — a screenplay in (Fountain, a Final Draft .fdx, a PDF, or Markdown script pages), per-scene .world packages with set/cast/coverage, a printable board and a shot-list CSV out. Deterministic: no model, no network, no renderer"
keywords = ["localgpt", "previs", "screenplay", "fountain", "markdown"]
categories = ["multimedia::video", "parser-implementations"]

[features]
default = ["pdf"]
# A screenplay PDF: the text layer read back into elements by where it
# sits on the page (`pdf.rs`). On by default; Gen, which only stages and
# boards, turns it off.
pdf = ["dep:pdf-extract"]

[lib]
name = "localgpt_previs"
path = "src/lib.rs"

[[bin]]
name = "localgpt-previs"
path = "src/main.rs"

# The Fountain a PDF reads as, for checking a generator's output by eye.
[[example]]
name = "pdf_fountain"
required-features = ["pdf"]

[dependencies]
# The shared LocalGPT world format: `WorldManifest`, `WorldEntity` (the
# `ext-cinematography` blocks ride its `extra` map), the canonical
# `manifest_text_of` for `manifest.json`, `sha256_hex` for `package.json`,
# and `fold_log`/`WorldDoc` for the package round-trip test.
localgpt-world-types = { workspace = true }
# world-types re-exports the document types but not the package/fold/hash
# machinery (`manifest_text_of`, `fold_log`, `sha256_hex`, `WorldDoc`) —
# the .world writer and the package round-trip test use those directly.
openworldformat = { workspace = true }
# The vendored three.js + world viewer the board drives (`WORLD_VIEWER_JS`
# and friends as string constants — copied next to board.html, offline).
localgpt-world-export = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
# Final Draft's .fdx is XML (`fdx.rs`): the typed paragraphs come out of
# a DOM walk, entities resolved by the parser.
roxmltree = { workspace = true }
# A PDF's text with positions, for `pdf.rs` (the `pdf` feature).
pdf-extract = { workspace = true, optional = true }

[dev-dependencies]
# The board tests decode the import map's base64 `data:` URLs (the
# encoding itself is world-export's `module_data_url`).
base64 = { workspace = true }
