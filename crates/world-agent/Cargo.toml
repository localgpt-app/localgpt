[package]
name = "localgpt-world-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The live authority, packages and headless commands of a .world, the MCP servers its tools are served through, and the shared paths of the LocalGPT apps"
keywords = ["localgpt", "world", "3d", "agent"]
categories = ["game-development"]

[features]
# The `Tool` trait and the stdio MCP server over a tool set (`mcp`): what
# `localgpt world mcp` and `localgpt-gen mcp-server` serve.
mcp = ["dep:tokio", "dep:async-trait", "dep:anyhow"]
# The MCP streamable HTTP transport (`mcp::http`), for `--mcp-http`.
mcp-http = [
    "mcp",
    "dep:axum",
    "dep:tower-http",
    "dep:async-stream",
    "dep:futures",
    "dep:uuid",
]

[dependencies]
localgpt-world-types = { workspace = true }
localgpt-world-sync = { workspace = true }
# The format itself: the canonical manifest text a seeded world is written with.
openworldformat = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `session`: the session package on disk (RON base + JSONL log + JSON meta).
ron = "0.12.1"
sha2 = "0.11"
# `session`: the .world transport form (stored entries — assets are already
# compressed media, and the log stays inspectable in the archive).
# 9: `extract` confines symlinks and permissions to the destination
# (RUSTSEC-2026-0367/0368/0369); `extract_zip` runs it on a `.world` a
# person opens, so no earlier version will do.
zip = { version = "9", default-features = false }

# `mcp` reads stdin and writes stdout with it and listens for Ctrl+C.
tokio = { version = "1", features = ["rt", "time", "io-util", "io-std", "signal", "macros", "sync"], optional = true }
# `mcp`: the `Tool` trait is async.
async-trait = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# `mcp-http`: the streamable HTTP transport.
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
async-stream = { version = "0.3", optional = true }
futures = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# `paths`: the shared asset-pack directory and the app directories, so the
# XDG rule lives here once instead of in every app.
etcetera = "0.11"

[dev-dependencies]
# The view, to prove authority and view agree. Not a production edge: the
# authority must not know about its viewers.
localgpt-world-editor = { workspace = true }
