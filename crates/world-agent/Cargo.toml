[package]
name = "localgpt-world-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The shared world agent runtime — the tool-call protocol and pure SceneInterpreter that build localgpt-world-types entities, with the mistral.rs session loop behind `llm`"
keywords = ["localgpt", "world", "3d", "agent"]

[features]
# The mistral.rs session loop (`run_session`, `tool_schemas`).
llm = ["dep:mistralrs", "dep:tokio"]
# Apple-Silicon GPU path (macOS-only; never build this in Linux CI).
llm-metal = ["llm", "mistralrs/metal"]
# JsonSchema derives on the protocol types (world-types' `schema` pattern):
# Verse's recipe/agent schemas derive schemars over them under its `llm`.
schema = ["dep:schemars"]

[dependencies]
localgpt-world-types = { workspace = true }
localgpt-world-sync = { workspace = true }
# The format itself: the canonical manifest text a seeded world is written with.
openworldformat = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
schemars = { version = "1.2", optional = true }
# `session`: the session package on disk (RON base + JSONL log + JSON meta).
ron = "0.12.1"
sha2 = "0.11"
# `session`: the .world transport form (stored entries — assets are already
# compressed media, and the log stays inspectable in the archive).
zip = { version = "6", default-features = false }

mistralrs = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
# `paths`: the shared model and asset-pack directories, so the XDG rule
# lives here once instead of in every app.
etcetera = "0.11"

[dev-dependencies]
# The view, to prove authority and view agree. Not a production edge: the
# authority must not know about its viewers.
localgpt-world-editor = { workspace = true }
