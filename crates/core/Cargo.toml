[package]
name = "localgpt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["localgpt", "ai", "agent", "memory", "assistant"]
categories = ["artificial-intelligence"]
description = "Core library for LocalGPT — agent, memory, config, security"
readme = "README.md"

[features]
# Memory searches by keyword (SQLite FTS5), or with an embeddings API when
# one is configured; the in-process models (fastembed over ONNX Runtime,
# llama.cpp) and sqlite-vec left with the mobile apps.
default = ["claude-cli", "gemini-cli", "codex-cli", "image-resize"]
# The CLI providers: each runs its agent as a subprocess.
claude-cli = []
gemini-cli = []
codex-cli = []
# Image optimization for vision models (resizes before sending to LLM)
image-resize = ["dep:image"]
# MCP streamable HTTP transport (adds axum + tower-http)
mcp-http = ["dep:axum", "dep:tower-http"]

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
shellexpand = { workspace = true }

# Image optimization
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }

# MCP HTTP transport (optional)
axum = { version = "0.8", features = ["macros"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# File watching
notify = "8.2"

# Path resolution
etcetera = "0.11"
libc = "0.2"

# Utilities
which = "8"
async-stream = "0.3"
glob = "0.3"
base64 = "0.22"
regex = "1"
once_cell = "1"
# default-features = false drops readability's optional reqwest 0.11 client (and its
# unpatched hyper 0.14 / h2 0.3 line); LocalGPT fetches with its own reqwest and
# only calls `extractor::extract` on the bytes.
readability = { version = "0.3", default-features = false }
tempfile = "3.27"

# Security (hashing for memory index & media cache)
sha2 = "0.11"

# JWT signing (for Vertex AI service account auth: RS256 with the service
# account's key). The AWS-LC backend, not `rust_crypto`: the latter brings the
# `rsa` crate, whose private-key operations are not constant-time
# (RUSTSEC-2023-0071, no fixed release), and the ECDSA stack over
# crypto-bigint 0.5 (RUSTSEC-2026-0387), for algorithms LocalGPT never signs
# with.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

[dev-dependencies]
tempfile = "3.27"
mockall = "0.14"
filetime = "0.2"
# A throwaway RSA key for the service-account signing test, made at test time
# so no private key is committed; jsonwebtoken already brings the crate.
aws-lc-rs = "1.18"
