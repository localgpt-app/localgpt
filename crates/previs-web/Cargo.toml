[package]
name = "localgpt-previs-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The localgpt previs page's WASM: a Fountain screenplay in, every scene's .world package, the shot list and the printable board out, in the browser tab"
repository.workspace = true
keywords = ["localgpt", "previs", "screenplay", "wasm", "storyboard"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The whole of previs is pure — no Bevy, no model, no tokio, no network —
# which is what lets the page be free: the draft is a function of the
# text, computed where the text already is. The CLI runs the same
# `localgpt_previs::draft`, so the page's board is the CLI's.
localgpt-previs = { path = "../previs" }

wasm-bindgen = "0.2"
serde_json = { workspace = true }

[package.metadata.wasm-pack.profile.release]
# wasm-opt off, as for md-web: the locally installed binaryen predates
# bulk-memory operations, so `wasm-opt -O` fails validation. The
# unoptimized module is what the page check verifies anyway.
wasm-opt = false
