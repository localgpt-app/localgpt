[package]
name = "localgpt-previs-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The localgpt.md page's WASM: a screenplay in (Fountain, Final Draft, PDF or Markdown), every scene's .world package, the shot list and the printable board out, in the browser tab"
repository.workspace = true
keywords = ["localgpt", "previs", "screenplay", "wasm", "storyboard"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The whole of previs is pure — no Bevy, no model, no tokio, no network —
# which is what lets the page be free: the draft is a function of the
# text, computed where the text already is. The CLI runs the same
# `localgpt_previs::draft`, so the page's board is the CLI's.
# With the PDF reader: the page reads PDFs too.
localgpt-previs = { path = "../previs", features = ["pdf"] }

wasm-bindgen = "0.2"
serde_json = { workspace = true }

[package.metadata.wasm-pack.profile.release]
# wasm-opt off: the locally installed binaryen predates bulk-memory
# operations (memory.copy), which rustc emits for wasm32 by default, so
# `wasm-opt -O` fails validation and takes the deploy with it. The
# unoptimized module is what the page check verifies anyway — same bytes
# locally and in CI.
wasm-opt = false
