[package]
name = "localgpt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The LocalGPT desktop app — one window, every mode: worlds from a prompt (Gen), a document (MD) or a song (Verse); the assistant follows"
# The desktop app ships as a build, not a crate: nothing published
# depends on it, and its md and verse dependencies carry no version.
publish = false
repository.workspace = true
keywords = ["localgpt", "desktop", "world", "bevy"]

[features]
# In-process GGUF models (`gguf/<name>`, from the model folder every LocalGPT
# app shares) for the prompt panel and document authoring, through Gen's
# mistral.rs provider. Off by default: mistral.rs is a large build.
local-llm = ["localgpt-gen/local-llm"]
# The Apple-Silicon GPU path for local-llm — what the macOS bundle builds
# with (apps/app-desktop). macOS only: never in the Linux CI job.
local-llm-metal = ["local-llm", "localgpt-gen/local-llm-metal"]

[dependencies]
localgpt-core = { workspace = true }
localgpt-gen = { path = "../gen" }
# The pure half only: the app compiles Markdown to a world manifest in-process
# and never needs MD's renderer, which is this app's own viewport.
localgpt-md = { path = "../md", default-features = false }
# Songs: Verse's library turns a song file into its world (analysis, mood,
# props, soundtrack curves and modulations), and Gen's viewport plays it.
localgpt-verse = { path = "../verse" }
localgpt-world-types = { workspace = true }
# The soundtrack the loaded world performs, for the timeline's clock.
localgpt-world-bevy = { workspace = true }
# The timeline's shot track is the shot list the previs board draws.
localgpt-previs = { workspace = true }
# The song's waveform for the timeline, decoded as Verse decodes songs.
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4", "aiff"] }
# The shots' thumbnails go to the page as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The world-building protocol (tool specs, section prompt, Session) that the
# app drives with its configured model, as MD drives it with a local GGUF.
localgpt-world-agent = { workspace = true }
# Section hashes are MD's cache keys.
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# A world folder is world.ron, the format Gen LoadWorld reads.
ron = "0.12.1"
# The native "Open…" picker (Verse's version, so one copy in the build).
rfd = "0.17"

bevy = { version = "0.19", features = ["jpeg", "system_font_discovery"] }
# The agents' terminals: a PTY per tab (WezTerm's crate), its bytes to xterm.js.
portable-pty = "0.9"
base64 = { workspace = true }

# The interface's host: one WebKit view over the window (wry), and the
# AppKit view that lets clicks in the page's hole fall through to the
# viewport. macOS first; Windows (WebView2) next, and Linux needs webkit2gtk,
# where wry nests a view on X11 only.
[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.57", features = ["devtools"] }
# The page itself (ui/dist): read from disk in a debug build, so a rebuilt
# page needs no Rust rebuild; inside the binary in a release one.
rust-embed = "8"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView"] }
