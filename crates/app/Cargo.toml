[package]
name = "localgpt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The LocalGPT desktop app — native panels for worlds from documents, songs and packages, with external coding agents beside them"
# The desktop app ships as a build, not a crate: nothing published
# depends on it, and its md and verse dependencies carry no version.
publish = false
repository.workspace = true
keywords = ["localgpt", "desktop", "world", "bevy"]

[dependencies]
localgpt-gen = { path = "../gen" }
# The pure half only: the app compiles Markdown to a world manifest in-process
# and never needs MD's renderer, which is this app's own viewport.
localgpt-md = { path = "../md", default-features = false }
# Songs: Verse's library turns a song file into its world (analysis, mood,
# props, soundtrack curves and modulations), and Gen's viewport plays it.
localgpt-verse = { path = "../verse" }
localgpt-world-types = { workspace = true }
# The soundtrack the loaded world performs, for the timeline's clock.
localgpt-world-bevy = { workspace = true }
# The timeline's shot track is the shot list the previs board draws.
localgpt-previs = { workspace = true }
# The song's waveform for the timeline, decoded as Verse decodes songs.
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4", "aiff"] }
# The shots' thumbnails go to the page as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The world-building protocol (tool specs, section prompt, Session) that the
# app drives with its configured model, as MD drives it with a local GGUF.
localgpt-world-agent = { workspace = true }
# The bar's Audio panel installs and removes the optional audio models; the
# catalog and the installer only, so the window links no model runtime.
localgpt-audio-models = { workspace = true }
# Section hashes are MD's cache keys.
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# A world folder is world.ron, the format Gen LoadWorld reads.
ron = "0.12.1"
# The native "Open…" picker (Verse's version, so one copy in the build).
rfd = "0.17"

bevy = { version = "0.20", features = ["jpeg", "system_font_discovery"] }
# The shell (`src/shell`, `docs/rfcs/authoring/all-rust.md`): eframe owns
# the window and egui draws the panels, on the same wgpu device Bevy draws
# the world with (both on wgpu 30). Its defaults bring the system fonts for
# what egui's own lack, accesskit, the clipboard, and x11 and wayland.
eframe = "0.37"
# The shell's panels as tiles: tabs to drag, splits to resize. Released with
# each egui by egui's makers (egui_dock trails a release).
egui_tiles = "0.18"
# Each terminal tab's screen in the shell: the emulator under Zed's and
# Alacritty's terminals, fed the same PTY bytes the page is sent.
alacritty_terminal = "0.26"
# The agents' terminals: a PTY per tab (WezTerm's crate), its bytes to xterm.js.
portable-pty = "0.9"
# Each tab's screen as a terminal draws it, for a page that attaches late,
# and the titles that say what an agent is doing.
vt100 = "0.18"
base64 = { workspace = true }
# The built page (ui/dist), for a paired device's browser: read from disk in
# a debug build, so a rebuilt page needs no Rust rebuild; inside the binary
# in a release one.
rust-embed = "8"
# A paired phone's line: the page over HTTP and its messages over a
# WebSocket — Gen's axum, so no second server stack — and the pairing code
# as a QR code.
axum = { version = "0.8", features = ["ws"] }
futures = { workspace = true }
rand = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
# The shell's panels under test without a window: egui driven headlessly,
# its widgets found through AccessKit, clicked and typed into
# (docs/rfcs/authoring/all-rust.md, step G). Released with each egui.
egui_kittest = "0.37"
