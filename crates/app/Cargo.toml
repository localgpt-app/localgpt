[package]
name = "localgpt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The LocalGPT desktop app — one window, every mode: worlds from a prompt (Gen), a document (MD) or a song (Verse); the assistant follows"
repository.workspace = true
keywords = ["localgpt", "desktop", "world", "bevy"]

[features]
# In-process GGUF models (`gguf/<name>`, from the model folder every LocalGPT
# app shares) for the prompt panel and document authoring, through Gen's
# mistral.rs provider. Off by default: mistral.rs is a large build.
local-llm = ["localgpt-gen/local-llm"]
# The Apple-Silicon GPU path for local-llm — what the macOS bundle builds
# with (apps/app-desktop). macOS only: never in the Linux CI job.
local-llm-metal = ["local-llm", "localgpt-gen/local-llm-metal"]

[dependencies]
localgpt-core = { workspace = true }
localgpt-gen = { path = "../gen" }
# The pure half only: the app compiles Markdown to a world manifest in-process
# and never needs MD's renderer, which is this app's own viewport.
localgpt-md = { path = "../md", default-features = false }
# Songs: Verse's library turns a song file into its world (analysis, mood,
# props, soundtrack curves and modulations), and Gen's viewport plays it.
localgpt-verse = { path = "../verse" }
localgpt-world-types = { workspace = true }
# The soundtrack the loaded world performs, for the now-playing transport.
localgpt-world-bevy = { workspace = true }
# The world-building protocol (tool specs, section prompt, Session) that the
# app drives with its configured model, as MD drives it with a local GGUF.
localgpt-world-agent = { workspace = true }
# Section hashes are MD's cache keys.
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# A world folder is world.ron, the format Gen LoadWorld reads.
ron = "0.12.1"
# The native "Open…" picker (Verse's version, so one copy in the build).
rfd = "0.17"

bevy = { version = "0.19", features = ["jpeg", "system_font_discovery"] }
# Same version as Gen, so there is one egui context and one copy of the crate.
bevy_egui = "0.40"
