[package]
name = "localgpt-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Secure IPC protocol for LocalGPT bridge daemons"
readme = "README.md"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
interprocess = { version = "2.4", features = ["tokio"] }
tarpc = { version = "0.37.0", features = ["tokio1", "serde-transport"] }
tokio-serde = { version = "0.9", features = ["json"] }
futures = "0.3"
clap = { version = "4.6.0", features = ["derive"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"
